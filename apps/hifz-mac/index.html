<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حفظ</title>
  <meta name="description" content="Plan, track and review Quran memorization.">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hifz">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">ح</div>
        <div>
          <div class="brand-name" data-i18n="brandName">حِفظ</div>
          <div class="brand-sub" data-i18n="brandSub"></div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#day" data-view="day"><span class="ico" aria-hidden="true">◉</span><span data-i18n="nav.day"></span><span class="nav-badge" id="badge-today"></span></a>
        <a href="#plan" data-view="plan"><span class="ico" aria-hidden="true">▦</span><span data-i18n="nav.plan"></span></a>
        <a href="#history" data-view="history"><span class="ico" aria-hidden="true">☰</span><span data-i18n="nav.history"></span></a>
        <a href="#insights" data-view="insights"><span class="ico" aria-hidden="true">◔</span><span data-i18n="nav.insights"></span></a>
        <a href="#backup" data-view="backup"><span class="ico" aria-hidden="true">⇅</span><span data-i18n="nav.backup"></span></a>
      </nav>
      <div class="side-foot">
        <div class="seg small lang-switch" role="group" aria-label="Language / اللغة">
          <button data-lang="ar" lang="ar">العربية</button><button data-lang="en" lang="en">English</button>
        </div>
        <div class="last-export" id="last-export"></div>
        <button id="btn-export-side" data-i18n="exportBackup"></button>
        <div class="keys muted" data-i18n="keysHint"></div>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <dialog id="dlg"></dialog>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
