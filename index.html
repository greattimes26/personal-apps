<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personal Apps</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    a { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: inherit; text-decoration: none; }
    a:hover { background: var(--surface-2); }
    img { width: 40px; height: 40px; border-radius: 9px; }
    small { display: block; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Personal Apps</h1>
    <ul>
      <li><a href="apps/hifz-mac/"><img src="apps/hifz-mac/icons/icon-192.png" alt=""><span>Hifz — Mac<small>Plan, track and review Quran memorization</small></span></a></li>
    </ul>
  </main>
</body>
</html>
